; EspAudio — Arduino / PlatformIO.
; Open this folder as the project. Sketch = examples/octopus.
; Flash: pio run -e esp32-s3 -t upload
; or the iSystem WebSerial tool in tools/isystem-flash/

[platformio]
src_dir = examples/octopus
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = .
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:esp32-p4]
platform = espressif32
board = esp32-p4-evboard
framework = arduino
lib_extra_dirs = .
monitor_speed = 115200
